[project]
name = "aw-ig-reels"
version = "0.1.0"
description = "Generator gotowych IG Reels dla Architekt Wolności (grok-imagine-video)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "xai-sdk>=1.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
aw-reels = "aw_reels.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["aw_reels*"]
