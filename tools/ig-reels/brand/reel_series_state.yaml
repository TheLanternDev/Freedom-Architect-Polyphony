# Stan serii reelsów IG — Architekt Wolności (chronologia publikacji).
# Aktualizowany na końcu każdego dnia przez automation "AW — Daily IG Reel 09:00".
# Reel #2 = KTO (9 agentów). Reel #3+ = CO DALEJ (jeden motyw / odcinek).

published_order: [reel3_brief_w_rade]  # session_id lub concept_id gotowych do IG (w kolejności wrzucania)
next_concept_id: reel3_szow_glos      # następny do produkcji (#3B — Głos cienia)
pending_concept_id: null     # #3A domknięty 2026-06-07 (potwierdzone przez użytkownika)
episode_number: 3            # ostatni POTWIERDZONY = reel #3 (reel3_brief_w_rade)
last_session_id: null        # session_id ostatniego ukończonego pipeline'u

# Kolejka (źródło prawdy: concepts.yaml → policy.reel_series.reel3_queue):
#   reel3_brief_w_rade   — Brief wchodzi do Rady
#   reel3_szow_glos      — Głos cienia
#   reel3_zobowiazanie_72h — Zobowiązanie 72h
# Po wyczerpaniu: agent projektuje reel #4+ jako kontynuację (match cut z ostatniej mandali).
