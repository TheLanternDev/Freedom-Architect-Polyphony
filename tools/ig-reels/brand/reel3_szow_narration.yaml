# Reel #3B — „Głos, którego nie chcesz" (15s). Off-screen, bez lip-sync.
# Jeden głos prowadzący: Szow (cień). Bez chóru — to beat kontrariański po #3A.
# Uruchom: aw-reels narrate-council SESSION --timeline brand/reel3_szow_narration.yaml

reel_duration_s: 15

# role: whisper | lead | cta — steruje loudnorm (ujednolicony poziom per rola).
# Szow: voice_name Daniel, speed bazowe 0.86 (agent_voices.yaml) — nisko, godnie, bez agresji.
segments:
  - start_s: 2.2
    speaker: Szow
    text: "Nie jestem tu, żeby cię pocieszyć."
    role: lead
    speed: 0.86
  - start_s: 4.6
    speaker: Szow
    text: "Jestem tu, żebyś przestał udawać."
    role: lead
    speed: 0.86
  # 8.0–11.0s — overlay tekstowy „Wracasz do ChatGPT, bo tam nikt nie powie,
  # że się boisz." Głos Szowa wchodzi nisko pod napis, długa cisza po.
  - start_s: 8.4
    speaker: Szow
    text: "Tam nikt nie powie, że się boisz."
    role: lead
    speed: 0.84
  # 11.0–13.0s — seam: spark + bass hit + pół sekundy ciszy (bez mowy).
  # 13.0–15.0s — domknięcie / CTA.
  - start_s: 12.7
    speaker: Szow
    text: "Nie jestem twoim wrogiem."
    role: cta
    speed: 0.94
  - start_s: 13.7
    speaker: Szow
    text: "Jestem uczciwością."
    role: cta
    speed: 0.96
