# Gotowe koncepcje reelsów — uruchom: aw-reels new [concept_id]
#
# ═══ POLITYKA KANONU (NIE ZMIENIAĆ BEZ WYRAŹNEGO POLECENIA) ═══
# Wygląd dziewięciu agentów Rady + Syeza oraz struktura reela
# Rada-Polyphony-24.5s-IG.mp4 są ZABLOKOWANE jako domyślny kanon wizualny.
# Modyfikuj agents_canon, rada_polyphony_moj_swiat lub portrety wyłącznie
# po jednoznacznej instrukcji użytkownika (np. „zmień portret Szowa”).
#
# Pola konceptu:
#   identity: klucz z brand_motifs (logo_ring | fragment | aksjomat_0/1/2 | rada | syez | szow)
#   default: true → domyślny koncept przy `aw-reels new` bez argumentu
#   locked: true → generator nie powinien nadpisywać wyglądu agentów
#   signature: true → dosyp delikatny logo-motyw (świetlisty pierścień) na końcu ujęcia
#   tier: hero | standard | minimal — `hero` sugeruje --strict przy własnych promptach

policy:
  locked_canon: true
  default_concept: rada_polyphony_moj_swiat
  reference_mp4: /Users/tpltd145/Downloads/Rada-Polyphony-24.5s-IG.mp4
  fcp_timeline: brand/fcp_rada_timeline.yaml
  change_policy: >-
    Nie zmieniaj wyglądu agentów, kolejności montażu ani struktury domyślnego
    reela bez wyraźnego polecenia użytkownika.
  portrait_fidelity: >-
    Wygląd każdego agenta i Syeza MUSI być wierny 1:1 portretom PNG w
    assets/council/ (kanon z załączników użytkownika). Generacja wideo, prompty,
    edycje i FCP — bez redesignu twarzy, wieku, fryzury, szat ani motywów
    (Metatron, split-face Szowa, klucze Deegi itd.). Referencja: agents_canon.
  reel_series:
    reel2: rada_polyphony_moj_swiat
    reel3_queue:
      - reel3_brief_w_rade
      - reel3_szow_glos
      - reel3_zobowiazanie_72h

# Kanoniczne portrety — źródło prawdy dla generatora i FCP bundle.
# Pliki PNG: assets/council/{id}.png (kolejność = montaż Polyphony).
# Opisy zablokowane wg załączonych portretów i finalnego MP4 24.5s.
agents_canon:
  Relacjan:
    file: Relacjan.png
    role: "Relacje i zaufanie"
    tagline: "Mapuje wpływ, dynamikę i ludzi wokół decyzji"
    visual: >-
      Middle-aged Caucasian man, salt-and-pepper beard, warm knowing half-smile,
      dark charcoal layered robe with fine golden neural-network embroidery.
      Glowing golden constellation nodes and thread-lines orbit his shoulders.
      Cinematic chiaroscuro, dignified relational warmth — never generic stock face.
  Kogit:
    file: Kogit.png
    role: "Logika i struktura"
    tagline: "Zimna architektoniczna jasność"
    visual: >-
      East Asian man, 50s–60s, calm focused gaze off-camera, thick dark hair with
      silver at temples swept back. Dark grey kimono-style robe with gold trim.
      Large luminous Metatron-cube sacred geometry glowing on chest. Floating
      golden particles, architectural precision, cold clarity.
  Emojy:
    file: Emojy.png
    role: "Emocje prewerbalne"
    tagline: "To, czego słowa jeszcze nie niosą"
    visual: >-
      Young East Asian man, late teens–20s, messy textured black hair with golden
      light sparks woven through. Large luminous golden eyes with fine geometric
      clockwork patterns in irises. Dark high-collared robe with shimmering gold
      circuitry embroidery. Floating translucent golden octahedrons. Pre-verbal
      intensity, not childish.
  Deega:
    file: Deega.png
    role: "Głęboka diagnoza"
    tagline: "Nieświadome pętle i ukryte powtórzenia"
    visual: >-
      Mature man, 50s–60s, long dark hair with grey streaks parted center,
      pointed grey goatee, stern piercing light eyes. Heavy dark robe with ornate
      golden keys and alchemical sigils embroidered. Floating antique golden keys
      connected by thin glowing lines in background. Arcane scholar, deep diagnosis.
  Smaty:
    file: Smaty.png
    role: "Somatyczny"
    tagline: "To, co ciało już wie"
    visual: >-
      Muscular middle-aged man, late 40s–50s, chiseled jaw, short dark hair grey
      at temples, heavy stubble. Powerful athletic build, dark draped toga-like
      robes. Glowing golden topographic energy veins on chest, arms and skin —
      liquid-gold currents in fabric. Atmospheric smoke, embodied power, somatic truth.
  Tai:
    file: Tai.png
    role: "Perspektywa czasu"
    tagline: "Długie wzorce i konsekwencje przyszłości"
    visual: >-
      East Asian elder, late 50s–60s, sharp cheekbones, dark hair with prominent
      silver streaks swept back. Dark textured robe with golden spiral and hourglass
      embroidery on lapels. Background: floating translucent hourglasses with golden
      sand, clockwork gears, temporal golden particles. Wise, time-architect mood.
  Szow:
    file: Szow.png
    role: "Cień"
    tagline: "To, czego najmniej chcesz usłyszeć"
    visual: >-
      Man, late 40s–50s, thick dark hair with messy silver-white streaks swept back.
      Split-face effect: left half consumed by black shadow with golden sparks;
      right half fair skin overlaid with glowing golden neural-web lines (kintsugi
      style). Intense amber-gold eyes. Dark layered coat with golden thread patterns.
      Dignified Jungian shadow — never horror, never softened.
  Obver:
    file: Obver.png
    role: "Obserwator zewnętrzny"
    tagline: "Meta-perspektywa poza twoją historią"
    visual: >-
      Man, late 40s–50s, thick wavy salt-and-pepper hair, short trimmed beard,
      piercing light eyes looking off-camera. Dark high-collared robe with ornate
      gold embroidery and geometric gold pendant at neckline. Sacred-geometry golden
      lines overlaid on face — circles, triangles, nodes. External witness, meta-view.
  Kidi:
    file: Kidi.png
    role: "Dziecięca ciekawość"
    tagline: "Czysta fascynacja i instynkt"
    visual: >-
      Young man, early–mid 20s, thick wavy dark hair, defined jaw, light stubble,
      intense dark eyes with youthful wonder (not a child actor). Dark robe with
      intricate glowing golden flame-like embroidery. Fiery bokeh background with
      floating golden embers. Curious instinct, raw fascination — same dark-gold
      mystical palette as council.
  Syez:
    file: Syez.png
    role: "Syntetyzer i orkiestrator"
    tagline: "Lustro dziewięciu głosów — bez własnej perspektywy"
    visual: >-
      Middle-aged man, stern commanding presence, short dark hair grey at temples.
      Dark heavy robes with ornate gold embroidery. Brilliant golden Merkaba /
      sacred-geometry symbol glowing at center of chest; golden energy wisps
      radiate outward. Alchemical halo: floating golden hourglass, diamond, flame
      and sigil symbols around head. Syez is mirror-synthesizer — NEVER a tenth
      face in the nine-agent mandala; appears only in dedicated 4.5s segment
      (portrait + Polish narration, no lip-sync to council faces).
    narration_pl: >-
      Dziewięć głosów. Jedna polifonia. Syez trzyma mapę — Twoja Rada jest obudzona.

concepts:
  rada_polyphony_moj_swiat:
    title: "Rada Polyphony — Mój Świat (kanon 24.5s)"
    identity: rada
    tier: hero
    default: true
    locked: true
    hook: "Dziewięć głosów. Jedna polifonia. Twoja decyzja."
    reference_mp4: /Users/tpltd145/Downloads/Rada-Polyphony-24.5s-IG.mp4
    duration: 24.5
    assembly: fcp
    fcp_timeline: brand/fcp_rada_timeline.yaml
    scene: |
      Vertical 9:16 Instagram Reel. EXACTLY 24.5 seconds, 1080×1920, 30fps.
      Photorealistic dark mystical cinematic — deep blacks, warm gold #E8D5A3,
      subtle teal shadows. Golden particles, thin sacred geometry lines.
      LOCKED CANON: match agents_canon portraits exactly; do not redesign faces.

      ═══ NON-NEGOTIABLE COUNT ═══
      □ EXACTLY NINE different human council faces in montage — count must be 9
      □ Syez is ONLY voice + dedicated portrait segment — NEVER a tenth face in mandala
      □ Each named agent appears once, distinct face — do not merge or reuse

      ═══ TIMELINE (match reference_mp4 + fcp_timeline) ═══
      0.0–3.2s Opening: dark void, golden neural web, slow push-in. Golden serif text:
      "Za każdym ważnym wyborem / stoi coś więcej niż jeden głos."
      opening_scale: fit (letterbox seed visible).

      3.2–17.0s Council montage — nine portraits ~1.53s each, strict order:
      1 Relacjan — neural-network robe, warm relational smile
      2 Kogit — Metatron cube on chest, calm architectural clarity
      3 Emojy — glowing golden eyes, floating diamond geometry
      4 Deega — golden keys and sigils, stern deep-diagnosis gaze
      5 Smaty — muscular, golden energy veins on chest and arms
      6 Tai — hourglass and gears, temporal elder perspective
      7 Szow — split-face shadow/gold, dignified Jungian cień
      8 Obver — sacred geometry on face, external observer beard
      9 Kidi — youthful curious wonder, fiery golden embroidery
      Ken Burns zoom to eyes; golden cross-dissolve + thin energy threads between faces.

      17.0–21.5s Syez segment (4.5s): dedicated portrait per agents_canon.Syez —
      Merkaba chest glow, alchemical halo; Polish calm male narrator (off-screen):
      "Dziewięć głosów. Jedna polifonia. Syez trzyma mapę — Twoja Rada jest obudzona."
      Syez does NOT join the nine-face circle.

      21.5–24.5s Closing: all NINE council faces in golden mandala circle, slow pull-back.
      Golden serif text:
      RADA NADZORCZA „MÓJ ŚWIAT"
      9 Agentów. Jedna Polyfonia.
      Architekt Wolności
      Twój system. Twoja wolność.
      Lower: Founders Cohort • 10 miejsc przy stole • link w bio

      ═══ FORBIDDEN ═══
      ✗ Fewer than 9 council faces ✗ Duplicate portraits ✗ Syez as 10th mandala node
      ✗ Name labels on faces ✗ Redesigning locked agent likeness

      Assembly note: xAI/Grok seeds are B-roll only; canonical 24.5s export = FCP bundle
      (`aw-reels fcp-bundle`). Final reference: reference_mp4.
    audio: >-
      Deep cinematic ambient: low drones, warm evolving pads, subtle organic percussion.
      Syez narration: calm Polish male, measured pace, sidechain duck under voice.
      Mystic council / inner sanctum mood. Maximum dignity.

  rada_kregu:
    title: "Rada w kręgu"
    identity: rada
    tier: hero
    hook: "Dziewięć głosów. Jedno napięcie. Twoja decyzja."
    note: >-
      Koncepcyjny reel tożsamości Rady. Dla montażu Polyphony z portretami
      używaj wyłącznie domyślnego locked konceptu rada_polyphony_moj_swiat.
    scene: |
      Nine DISTINCT council portraits from agents_canon arranged in a circle on a
      dark reflective floor — each face matches its locked portrait description:
      Relacjan (neural gold), Kogit (Metatron), Emojy (golden eyes), Deega (keys),
      Smaty (lightning body), Tai (hourglass), Szow (split shadow), Obver (geometry
      face), Kidi (youthful fire). Camera slowly orbits; the nine never merge —
      they hold tension in formation. Atmospheric fog, gold and teal rim light,
      cathedral scale, deep navy void. No abstract shapes replacing named faces.
    audio: "Deep ambient drone, nine faint overlapping tones that never resolve into harmony, soft heartbeat."
    duration: 15

  architektura_marzenia:
    title: "Architektura Marzenia"
    identity: aksjomat_1
    hook: "Każda decyzja służy czemuś większemu. Inaczej traci sens."
    scene: |
      A single warm anchor-light hovers in a dark void — the core dream, the value-anchor.
      From it, a translucent golden blueprint unfurls: every drawn line bends back toward that one anchor,
      as if the whole structure is reasoning from a single source of meaning. Pillars and a bridge form,
      always oriented to the central light. Camera pushes forward through the blueprint into realized
      golden architecture — but the anchor-light stays visible at the heart. One continuous morphing shot.
    audio: "Inspiring piano building slowly from a single sustained root note, pencil-on-paper texture."
    duration: 15

  napięcie_decyzji:
    title: "Napięcie decyzji"
    identity: szow
    hook: "Prawda nie jest wygodna. Jest uczciwa."
    scene: |
      Portrait of Szow per agents_canon: split-face man, left shadow right golden neural web,
      silver-streaked hair, intense amber eyes. Warm gold light faces its own denser cast shadow —
      two opposing beams meet at the seam, visible friction. Camera slowly zooms into the seam;
      light fractures into prismatic rays. Dark navy, dramatic chiaroscuro, no comfort, no resolution.
    audio: "Tension strings, long silences between notes, one deep bass hit when light meets shadow."
    duration: 12

  wolność_świadomość:
    title: "Wolność = świadomość"
    identity: fragment
    hook: "Nie cel. Uśmiech, Perspektywa, Droga — żywy układ."
    scene: |
      Three luminous elements orbit each other in slow equilibrium above a dark terrace at dawn:
      a warm open glow (curiosity turned inward), a shifting lens that keeps revealing new horizon
      (perspective), and a path of light moving forward underfoot (the way). They sustain one another —
      when one dims, the others feed it. A silhouette stands still at the terrace edge, not chasing,
      just holding the system alive. Gold sunrise through massive stone columns, camera cranes up to infinite horizon.
    audio: "Expansive orchestral swell that breathes in cycles, wind through columns, distant birds."
    duration: 15

  doprowadzenie_do_końca:
    title: "Doprowadzenie do końca"
    identity: aksjomat_2
    hook: "Niedokończone marzenie to cień. Najmniejszy ruch — światło."
    scene: |
      A half-built luminous arch in darkness. Camera tracks along it; the FIRST missing segment closest
      to the viewer ignites in gold — the smallest next move — and only then does the next, and the next,
      each completion triggering the following until the arch closes and floods the scene with warm light.
      Emphasis on that first small ignition as the thing that unlocks the rest. Single continuous tracking shot.
    audio: "A single hammer strike, then echoing momentum building into a warm triumphant chord, ambience to silence."
    duration: 15

  syez_lustro:
    title: "Syez — lustro prawdy"
    identity: syez
    hook: "Nie dziesiąty głos. Lustro pozostałych dziewięciu."
    scene: |
      Portrait of Syez per agents_canon: Merkaba chest glow, alchemical halo symbols, stern synthesizer.
      A massive circular mirror floating in dark space reflects nine separate drifting lights —
      the mirror consolidates them as one honest composite, tensions intact, contradictions not smoothed.
      Camera orbits slowly. Teal and gold on navy void. Syez never invents — only reveals.
      Not a tenth council face in any nine-agent mandala.
    audio: "Minimalist piano, long reverb tail, subtle glass resonance as the nine lights meet the surface."
    duration: 10

  fragment_kosmologia:
    title: "Fragment"
    identity: fragment
    hook: "Zatrzymanie. W pauzie widać, że linearny cel to pułapka."
    scene: |
      Pure stillness first: a single point of warm light in vast navy darkness, breathing. Then the camera
      holds — refusing to rush forward — and in that pause the linear arrow of light racing toward a distant
      goal is revealed to dissolve into emptiness on arrival. The frame quietly reorganizes: the arrow gives
      way to a slow self-sustaining circle of three lights. Contemplative, almost meditative, the reward is
      in not moving. One unbroken shot, minimal, reverent.
    audio: "Near-silence, one low sustained drone, a single soft chime at the moment of the pause."
    duration: 12

  # ── Reel #3 — kontynuacja reela #2 (rada_polyphony_moj_swiat) ───────────────
  # Reel #2 = KTO (9 agentów + Syez). Reel #3 = CO DALEJ (jeden motyw na wariant).
  # Kolejność produkcji: policy.reel_series.reel3_queue

  reel3_brief_w_rade:
    title: "Reel #3A — Brief wchodzi do Rady"
    identity: rada
    tier: hero
    published: true          # #3A domknięty + opublikowany 2026-06-07
    continues: rada_polyphony_moj_swiat
    series: reel3
    hook: "Rada nie odpowiada. Spiera się — żebyś ty przestał."
    caption_pl: |
      Reel #2 pokazał, kto siedzi przy stole.
      Ten pokazuje, co się dzieje, gdy składasz temat.

      Nie jeden głos AI.
      Debata 9 perspektyw → synteza Syeza → twoje zobowiązanie.

      Co byś postawił przed Radą dziś wieczorem?
      ↓ link w bio
    scene: |
      Vertical 9:16 Instagram Reel. EXACTLY 15 seconds. Continuation of reel #2
      (rada_polyphony_moj_swiat) — MATCH CUT from last frame: nine-face golden mandala.
      Photorealistic dark mystical cinematic — deep blacks, warm gold #E8D5A3, teal shadows.
      LOCKED CANON: agent portraits per agents_canon; do not redesign faces.

      ═══ STRATEGY ═══
      Reel #2 introduced WHO. This reel shows WHAT HAPPENS — one brief enters the council,
      four perspectives flash, Syez synthesizes. NOT a repeat of the 9×1.53s portrait montage.

      ═══ TIMELINE ═══
      0.0–2.0s: Match cut — golden mandala from reel #2 end frame, ring pulses once.
      Golden serif center text: „Rada nie odpowiada. / Spiera się — żebyś ty przestał.”

      2.0–4.0s: At mandala center a luminous brief-block appears — abstract glowing text form,
      illegible glyphs, only shape (no readable user data). Slow push-in.
      Text: „Jeden brief. Dziewięć perspektyw.”

      4.0–10.0s: From mandala nodes — FOUR quick portrait flashes (~1.5s each), NOT nine:
      1 Kogit (Metatron cube, cold clarity) per agents_canon
      2 Emojy (golden eyes, pre-verbal intensity) per agents_canon
      3 Szow (split-face shadow, dignified) per agents_canon
      4 Smaty (golden energy veins, somatic power) per agents_canon
      Ken Burns to eyes; thin golden energy threads between flashes; soft overlapping ambient
      tones (debate tension, not dialogue lip-sync).

      10.0–13.0s: Mandala softens to bokeh; Syez portrait enters per agents_canon.Syez —
      Merkaba chest glow, alchemical halo. Mirror consolidates four lights into one honest map.
      Polish calm male voiceover (Syez, off-screen): „Nie wybieram za ciebie. Składam mapę napięć.”
      Syez is NOT a tenth mandala node.

      13.0–15.0s: Golden serif text:
      „Twój brief. Ich debata. Twoja decyzja.”
      Lower: Founders Cohort • link w bio

      ═══ SYEZ VOICEOVER (10.3–12.8s, Polish, calm, off-screen) ═══
      Nie wybieram za ciebie. Składam mapę napięć.

      ═══ FORBIDDEN ═══
      ✗ Full nine-portrait montage repeat from reel #2 ✗ Name labels on faces
      ✗ Syez as tenth circle member ✗ Redesigning locked agent likeness
    narration_timeline: brand/reel3_brief_narration.yaml
    agent_voices: brand/agent_voices.yaml
    final_prompt: prompts/reel3-brief-final-prompt.txt
    audio: >-
      Dynamic cinematic ambient: low drones building through four flashes, subtle percussive
      pulses on each perspective cut, warm pad under Syez voiceover, dignified fade at CTA.
    duration: 15

  reel3_szow_glos:
    title: "Reel #3B — Głos, którego nie chcesz"
    identity: szow
    tier: hero
    production_next: true
    continues: rada_polyphony_moj_swiat
    series: reel3
    hook: "Jeden głos w Radzie nie głosuje. Nazywa."
    narration_timeline: brand/reel3_szow_narration.yaml
    agent_voices: brand/agent_voices.yaml
    final_prompt: prompts/reel3-szow-final-prompt.txt
    caption_pl: |
      ChatGPT gładzi.
      Szow — nie.

      W Radzie jest głos, który mówi to, czego najmniej chcesz usłyszeć.
      Nie dlatego, żeby zranić.
      Dlatego, żebyś przestał udawać.

      Reel #2: kto siedzi przy stole.
      Ten: dlaczego jeden z nich jest najważniejszy.
    scene: |
      Vertical 9:16. EXACTLY 15 seconds. Continuation of reel #2 — contrarian beat after
      harmonious polyphony. One identity only: Szow the Shadow. Dark mystical cinematic,
      gold #E8D5A3, deep navy, teal shadows.

      ═══ TIMELINE ═══
      0.0–1.5s: Match cut — nine-face mandala from reel #2; ONLY Szow's node pulses bright,
      other eight nodes dim to near-dark. Golden serif: "Jeden głos w Radzie nie głosuje. / Nazywa."

      1.5–8.0s: Full-screen portrait of Szow per agents_canon — split-face, silver-streak hair,
      amber-gold eyes, left shadow / right golden neural-web lines. Slow Ken Burns zoom to eyes.
      No name label on face. Dignified Jungian shadow — never horror.

      8.0–11.0s: Split-face intensifies: left half shadow thickens; right half gold lines brighten.
      Golden serif text overlay (readable): "Wracasz do ChatGPT, bo tam nikt nie powie, że się boisz."
      Tension strings, long silence beat.

      11.0–13.0s: Shadow and light meet at the seam — single golden spark, prismatic fracture.
      One deep bass hit. Half-second held silence.

      13.0–15.0s: Slow pull-back — Szow as one node in mandala, eight others return faintly.
      Golden serif: "Szow nie jest twoim wrogiem. / Jest twoją uczciwością."
      Lower: Founders Cohort • link w bio

      ═══ FORBIDDEN ═══
      ✗ Softening Szow into comfort ✗ Horror / jump-scare aesthetics ✗ Multiple agent portraits
      ✗ Redesigning locked Szow likeness
    audio: >-
      Tension strings, long silences between notes, one deep bass hit at shadow-light seam,
      minimal room tone, confrontational but dignified — never aggressive EDM.
    duration: 15

  reel3_zobowiazanie_72h:
    title: "Reel #3C — 72 godziny"
    identity: aksjomat_2
    tier: hero
    continues: rada_polyphony_moj_swiat
    series: reel3
    hook: "Rada się obudziła. Teraz jeden ruch w 72h."
    caption_pl: |
      9 głosów to nie koniec.
      To początek domknięcia.

      Architekt Wolności nie kończy na „ciekawa odpowiedź AI”.
      Kończy na jednym ruchu w 72h — albo świadomej decyzji o archiwizacji.

      Bez cichego zniknięcia.
      ↓
    scene: |
      Vertical 9:16. EXACTLY 15 seconds. Continuation of reel #2 — outcome / conversion beat.
      One identity only: Axiom 2 Completion. NO full agent portraits (reel #2 already showed faces);
      only mandala echo in reflections. Dark navy, warm gold #E8D5A3, architectural metaphor.

      ═══ TIMELINE ═══
      0.0–2.0s: Match cut — mandala from reel #2 morphs into a half-built golden luminous arch
      in vast darkness. Golden serif: "Rada się obudziła. / Teraz jeden ruch w 72h."

      2.0–6.0s: Camera tracks along the arch. The FIRST missing segment closest to viewer
      ignites in gold — smallest next move, emphasis on first ignition not grand finish.
      Golden serif: "Niedokończone marzenie to cień."

      6.0–10.0s: Each completed segment triggers the next — chain of completions; arch metal
      reflects faint nine-node mandala pattern from reel #2. Single hammer strike, then
      building warm momentum.

      10.0–12.0s: Arch closes — flood of warm gold light. Center: commitment-card shape —
      luminous empty line suggesting "Dziś zrobię: _______" (blank for viewer to fill mentally).

      12.0–15.0s: Golden serif:
      "AKSJOMAT 2: nie ma «porzucam»."
      "Jest domknięcie albo świadoma archiwizacja."
      Lower: Freedom Portfolio OS • link w bio

      ═══ FORBIDDEN ═══
      ✗ Full council portrait montage ✗ Promising "objective truth" ✗ Generic motivational stock
    audio: >-
      Single hammer strike at first segment ignition, echoing momentum building into warm
      triumphant chord, then contemplative silence on commitment card, soft ambient tail.
    duration: 15

  logo_sygnatura:
    title: "Sygnatura — pierścień Rady"
    identity: logo_ring
    signature: true
    tier: minimal
    hook: "Architekt Wolności."
    scene: |
      In deep navy void, a luminous ring slowly draws itself — a perfect circle of nine faint nodes
      connected by a thread of gold light, a single brighter convergence point at its center.
      The ring rotates once, elegantly, the nine nodes pulsing in sequence then settling.
      Pure brand signature: minimal, architectural, no text, premium. Suitable as an intro or outro sting.
    audio: "Single resonant bell tone with long tail, soft ambient pad rising underneath."
    duration: 8
