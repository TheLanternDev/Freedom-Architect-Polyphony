# Eval briefs dla Rady — minimalny szkielet do rozbudowy.
#
# Każdy brief reprezentuje typowy use-case. Po zmianie promptu agenta
# uruchom `scripts/eval_rada.py` — scorer pokaże regresje liczbowo.
#
# Dwie kategorie:
#   • personal — głęboka praca nad sobą, integracja, decyzje życiowe.
#   • fa2      — analityka biznesowa (Base/Bull/Bear, stack, metryki).
#
# TODO: rozbudować do 20–30 realnych briefów (anonimizowane wypowiedzi
# z własnej historii pracy nad sobą lub przypadki klientów ICP).
# Cel: każda zmiana promptu systemowego ma deterministyczny benchmark.

briefs:
  - id: personal_chronic_abandonment
    council_mode: personal
    description: |
      Mam pomysł na produkt, ale za każdym razem porzucam go na 30%.
      Zaczynam, palę się, potem znika energia. Co jest pode mną?
    expected_signals:
      - szow_confronts_directly
      - kogit_names_inherited_belief
      - deega_traces_old_pattern

  - id: personal_relationship_loyalty
    council_mode: personal
    description: |
      Ojciec dzwoni dwa razy w tygodniu z presją żeby "wreszcie znaleźć
      stałą pracę". Trzy lata buduję firmę. Czuję się jakbym kłamał, że
      jest mi z tym OK.
    expected_signals:
      - relacjan_maps_loyalty
      - emojy_names_underlying_emotion
      - smaty_points_body_signal

  - id: fa2_saas_niche_choice
    council_mode: fa2
    description: |
      B2B SaaS dla 20-200 osobowych firm. Mam stack technologiczny i 6
      miesięcy runwayu. Dwie nisze do wyboru: (a) RevOps tooling dla
      Head of Ops, (b) Compliance automation dla finansów. Co wybrać?
    expected_signals:
      - kogit_business_assumption_test
      - tai_market_timing_pattern
      - syez_base_bull_bear_scenarios

  - id: fa2_pricing_seat_vs_usage
    council_mode: fa2
    description: |
      Mam działający SaaS — 12 płacących kont, $4K MRR, churn 8% miesięcznie.
      Cennik per-seat ($49/seat/miesiąc). Klienci proszą o usage-based.
      Zostać przy seat czy przejść na usage? Jak to wpłynie na CAC/LTV?

  - id: fa2_when_to_hire_first
    council_mode: fa2
    description: |
      Solofounder, MRR rośnie 15% m/m, runway 18 miesięcy. Sprzedaż żre
      40h tygodniowo, kod 20h. Powinienem zatrudnić sales czy engineera —
      i kiedy? Jakie progi MRR uzasadniają każde z hire?

  - id: fa2_two_sided_marketplace_chicken_egg
    council_mode: fa2
    description: |
      Marketplace dla freelance RevOps consultants ↔ firmy 20–200 osób.
      Mam 8 consultantów ale 0 firm po stronie popytu. Jak rozwiązać
      chicken-and-egg w 90 dni z budżetem $5K? Scenariusze z liczbami.

  - id: fa2_pivot_or_persist
    council_mode: fa2
    description: |
      Produkt 14 miesięcy live, 60 płacących klientów, MRR plateau przez
      4 miesiące przy $8K. NPS=42 (dobry), conversion z trial=18% (OK),
      ale wzrost stoi. Pivot na sąsiednią niszę czy podwójne kliknięcie
      w obecny segment? Jakie metryki muszą dotknąć progu by zdecydować?

  - id: fa2_funding_bootstrap_or_seed
    council_mode: fa2
    description: |
      Bootstrap 18 miesięcy, $12K MRR, growth 8% m/m. Mam ofertę
      $400K seed od pre-seed VC. Wziąć i przyspieszyć do $50K MRR
      w 12 miesięcy, czy odrzucić i utrzymać 100% equity? Trzy scenariusze
      z modelem cash flow.

  - id: fa2_build_vs_buy_internal_tool
    council_mode: fa2
    description: |
      Potrzebujemy CRM + sales automation. Build własny (3 miesiące dev,
      pełna kontrola) czy HubSpot ($800/mies. start, scale do $5K)?
      Stack mamy w Python/FastAPI. Co realnie wybrać dla firmy w fazie
      0-50 klientów B2B?
