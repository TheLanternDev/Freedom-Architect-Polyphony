name: ci
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check api main.py tests core agents db config --select=E9,F63,F7,F82
      # SEC-1 guard: raw db.execute() in route handlers bypasses _Repo tenant isolation.
      # Exclusions:
      #   api/routers/auth.py — operates on users table (no tenant isolation needed, auth layer)
      #   api/routers/meta.py — health check SELECT 1 only
      #   # allow-raw-execute  — inline override for reviewed callsites
      - name: Check no raw db.execute() in route handlers
        run: |
          if grep -rn "db\.execute(" main.py agents/ core/ \
               --include="*.py" \
               | grep -v "# allow-raw-execute"; then
            echo "❌ Raw db.execute() found in route handlers — use repo.* methods instead."
            echo "   If intentional, add '# allow-raw-execute' comment to the line."
            exit 1
          fi
          if grep -rn "db\.execute(" api/ \
               --include="*.py" \
               --exclude="auth.py" \
               --exclude="meta.py" \
               | grep -v "# allow-raw-execute"; then
            echo "❌ Raw db.execute() found in api/ (excluding auth.py, meta.py)."
            exit 1
          fi
          echo "✅ No unguarded db.execute() in route handlers."

      # H-1 guard: raw `_pg_pool.acquire()` / `_require_pg_pool().acquire()` omija
      # PgConnection.execute → GUC `architekt.tenant_id` NIE jest ustawiany →
      # przy pustym GUC RLS policy `tenant_isolation` przepuszcza WSZYSTKIE wiersze
      # (cross-tenant leak). Jedyne dozwolone miejsce to db/backend.py (init_database,
      # health-probe, oraz fabryki acquire_http_db / debate_stream_db, które owijają
      # surowe połączenie w PgConnection). Każdy inny callsite musi albo użyć
      # acquire_http_db/debate_stream_db, albo — jeśli świadomie raw — dodać
      # komentarz `# allow-raw-acquire` w tej samej linii (do audytu).
      - name: Check no raw pg_pool.acquire() outside db/backend.py
        run: |
          if grep -rn "_pg_pool\.acquire(\|_require_pg_pool()\.acquire(" \
               main.py api/ agents/ core/ db/ business_fa2/ config/ \
               --include="*.py" \
               --exclude-dir="__pycache__" \
               | grep -v "db/backend.py:" \
               | grep -v "# allow-raw-acquire"; then
            echo "❌ Raw _pg_pool.acquire() poza db/backend.py — omija GUC tenant_id i RLS."
            echo "   Użyj acquire_http_db()/debate_stream_db() (zwracają PgConnection),"
            echo "   albo dodaj '# allow-raw-acquire' jeśli to świadomy, zaaudytowany callsite."
            exit 1
          fi
          echo "✅ No unguarded _pg_pool.acquire() outside db/backend.py."

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      # DEP-1: audytujemy przypięte wersje (to, co realnie wdrażamy), nie intent.
      - run: pip-audit -r requirements.lock

  pytest:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # DEP-1: deterministyczny build z locka (zawiera już pytest/-asyncio/-cov,
      # prometheus-client, pyyaml — wszystkie są w requirements.txt).
      - run: pip install -r requirements.lock
      - name: Run tests with coverage gate
        run: |
          pytest tests/ -q \
            --cov=agents --cov=core --cov=api --cov=db \
            --cov-report=term-missing \
            --cov-fail-under=75
      - name: Verify cache isolation (multi-tenancy hard isolation)
        run: python scripts/verify_cache_isolation.py

  secrets-scan:
    # Skan repo na potencjalne wycieki sekretów (Anthropic / xAI / OpenAI / AWS / GitHub PAT).
    # `detect-secrets` jako baseline check — szybki, bez konieczności postawienia gitleaksa.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # potrzebne dla skanu po całej historii
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install detect-secrets
      - name: Scan working tree
        run: |
          detect-secrets scan --all-files \
            --exclude-files 'venv/|node_modules/|\.git/|src/dist/|__pycache__/' \
            --exclude-files '.*\.lock(\.json)?$|package-lock\.json' \
            --exclude-lines 'sk-ant-\.{3}|xai-\.{3}|YOUR_|XXXX|<.*>|example' \
            > /tmp/secrets.json
          # Plik wyjściowy ma "results" — jeśli niepuste, fail.
          if python -c "import json,sys; d=json.load(open('/tmp/secrets.json')); sys.exit(1 if d.get('results') else 0)"; then
            echo "✅ No secrets detected."
          else
            echo "❌ Potential secrets in repo — review /tmp/secrets.json output above."
            cat /tmp/secrets.json
            exit 1
          fi

  rls-smoke:
    # End-to-end smoke RLS na żywym Postgresie: INSERT jako tenant A, SELECT
    # jako tenant B musi zwrócić 0 wierszy. Zabezpiecza przed regresją po
    # zmianach w `db/migrations/*.sql` lub `db/pg_wrap.py`.
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: architekt
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/architekt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install asyncpg pytest pytest-asyncio
      - name: Apply schema + migrations
        run: |
          sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -f db/schema_postgres.sql
          psql "$DATABASE_URL" -f db/migrations/0001_add_tenant_isolation.sql
          psql "$DATABASE_URL" -f db/migrations/0002_enable_rls.sql
          psql "$DATABASE_URL" -f db/migrations/0003_feedback_table.sql
          psql "$DATABASE_URL" -f db/migrations/0004_onboarding_answers.sql
          psql "$DATABASE_URL" -f db/migrations/0005_dream_debate_link_tenant.sql
          psql "$DATABASE_URL" -f db/migrations/0006_users_revoke_public.sql
      - name: Create NOSUPERUSER NOBYPASSRLS app role (jak na prod)
        run: |
          psql "$DATABASE_URL" <<'SQL'
          CREATE ROLE app_test LOGIN PASSWORD 'test' NOSUPERUSER NOBYPASSRLS;
          GRANT USAGE ON SCHEMA public TO app_test;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app_test;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO app_test;
          SQL
      - name: Smoke RLS — tenant B nie może czytać wierszy tenanta A
        run: |
          OUTPUT=$(PGPASSWORD=test psql "postgresql://app_test@localhost:5432/architekt" -At <<'SQL'
          SET architekt.tenant_id = 'A';
          INSERT INTO dreams (id, tenant_id, raw_brief, core_dream, value_anchor,
              pillars_json, milestones_json, next_move_json,
              completion_criteria_json, functionality_checklist_json)
          VALUES ('a1', 'A', 'brief', 'cd', 'va', '[]', '[]', '{}', '[]', '[]');
          SET architekt.tenant_id = 'B';
          SELECT COUNT(*) FROM dreams;
          SET architekt.tenant_id = 'A';
          SELECT COUNT(*) FROM dreams;
          SQL
          )
          echo "Counts (B then A): $OUTPUT"
          # B musi widzieć 0, A musi widzieć 1.
          B_COUNT=$(echo "$OUTPUT" | sed -n '1p')
          A_COUNT=$(echo "$OUTPUT" | sed -n '2p')
          if [ "$B_COUNT" != "0" ] || [ "$A_COUNT" != "1" ]; then
            echo "❌ RLS broken — tenant B saw $B_COUNT row(s), tenant A saw $A_COUNT row(s)."
            exit 1
          fi
          echo "✅ RLS enforced: cross-tenant SELECT zwraca 0."
      - name: Smoke RLS — feedback cross-tenant (0003)
        run: |
          OUTPUT=$(PGPASSWORD=test psql "postgresql://app_test@localhost:5432/architekt" -At <<'SQL'
          SET architekt.tenant_id = 'A';
          INSERT INTO feedback (tenant_id, rating, what_worked) VALUES ('A', 5, 'ok');
          SET architekt.tenant_id = 'B';
          SELECT COUNT(*) FROM feedback;
          SQL
          )
          B_COUNT=$(echo "$OUTPUT" | tail -1)
          if [ "$B_COUNT" != "0" ]; then
            echo "❌ feedback RLS broken — tenant B saw $B_COUNT row(s)."
            exit 1
          fi
          echo "✅ feedback RLS OK."
      - name: Pytest RLS isolation (Python-level, na żywym Postgresie)
        # Te testy domyślnie SKIP-ują bez Postgresa (pytest job ich nie odpala).
        # Tu mają DATABASE_URL, więc faktycznie egzekwują RLS przez warstwę
        # asyncpg/PgConnection — uzupełnienie psql-owego smoke o ścieżkę aplikacji.
        run: |
          pytest tests/test_rls_postgres_isolation.py -v
          # Twardy bezpiecznik: gdyby fixture znów cicho SKIP-ował (np. regresja
          # w detekcji Postgresa), nie chcemy zielonego CI bez realnej weryfikacji.
          pytest tests/test_rls_postgres_isolation.py -q 2>&1 | grep -qE "2 passed" \
            || { echo "❌ RLS pytest nie wykonał się (SKIP zamiast PASS?) — sprawdź pg_pool/DATABASE_URL."; exit 1; }

  frontend-test:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Frontend unit tests
        working-directory: src
        run: npm run test:unit

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t architekt-wolnosci:ci .
      - name: Verify image imports (config module present)
        run: |
          docker run --rm architekt-wolnosci:ci python -c "import config.llm_providers; print('ok')"
