# Ręczny build Tauri z podpisywaniem (macOS + Windows). Wymaga secrets w repo Settings.
#
# Buduje backend jako sidecar PyInstaller (scripts/build-backend-sidecar.sh /
# scripts/windows/build-backend-sidecar.ps1) PRZED `tauri build`, żeby paczka
# .dmg/.msi była samowystarczalna — tester nie instaluje Pythona ani Node.
# Bez sidecara .app/.msi auto-spawn backendu nie ma czego uruchomić
# (patrz docs/REVIEW_I_PACZKA_TESTOWA_2026-06-25.md, blocker B1).
name: tauri-release

on:
  workflow_dispatch:
    inputs:
      skip_sign_check:
        description: "Zbuduj bez podpisu (tylko dev/most bez certów — patrz docs/TAURI_RELEASE.md)"
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build backend sidecar (PyInstaller)
        run: ./scripts/build-backend-sidecar.sh
      - name: Install frontend deps
        working-directory: src
        run: npm ci
      # GitHub rozwija brakujące sekrety do pustych stringów. Samo pominięcie
      # walidacji nie wystarcza: obecność APPLE_CERTIFICATE="" uruchamia w Tauri
      # import pustego certyfikatu i kończy się SecKeychainItemImport. Wariant
      # unsigned celowo nie deklaruje żadnej zmiennej APPLE_*.
      - name: Build Tauri (unsigned)
        if: ${{ inputs.skip_sign_check == 'true' }}
        working-directory: src
        env:
          AW_TAURI_SKIP_SIGN_CHECK: "true"
          # MUSI wskazywać LOKALNY backend (review 2026-07-30). Paczka desktop
          # to model pudełkowy: sidecar słucha na 127.0.0.1:8000. Poprzednia
          # wartość domyślna 'https://api.example.com' dawała paczkę zepsutą
          # na dwa sposoby naraz:
          #   1. getApiBase() honoruje VITE_API_URL PRZED fallbackiem na
          #      localhost → apka wołała nieistniejącą domenę,
          #   2. sync-tauri-csp wstrzykiwał tę domenę do connect-src i NIE
          #      dodawał wpisów localhost (robi to tylko dla localhost/127.0.0.1)
          #      → CSP blokowałby 127.0.0.1:8000, nawet gdyby punkt 1 naprawić.
          # `vars.VITE_API_URL` zostaje jako świadome nadpisanie dla ewentualnego
          # builda pod hosting, ale domyślnie budujemy PUDEŁKO.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://127.0.0.1:8000' }}
        run: npm run tauri:build:release
      - name: Build Tauri (signed)
        if: ${{ inputs.skip_sign_check != 'true' }}
        working-directory: src
        env:
          AW_TAURI_SKIP_SIGN_CHECK: "false"
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://127.0.0.1:8000' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri:build:release
      - name: Ad-hoc sign unsigned app bundle
        if: ${{ inputs.skip_sign_check == 'true' }}
        working-directory: src
        run: |
          APP="src-tauri/target/release/bundle/macos/Freedom Architect.app"
          codesign --force --sign - --timestamp=none "$APP/Contents/MacOS/architekt-backend"
          codesign --force --sign - --timestamp=none "$APP/Contents/MacOS/architekt-wolnosci"
          codesign --force --sign - --timestamp=none --options runtime "$APP"
          codesign --verify --deep --strict --verbose=4 "$APP"
      - name: Create DMG
        working-directory: src
        run: ./scripts/make-dmg.sh
      - name: Sanity check — app, sidecar and DMG exist
        run: |
          APP="src/src-tauri/target/release/bundle/macos/Freedom Architect.app"
          SIDECAR="$APP/Contents/MacOS/architekt-backend"
          DMG=$(find src/src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name 'Freedom Architect_*.dmg' -print -quit)
          test -d "$APP" || { echo "::error::Brak $APP"; exit 1; }
          test -x "$SIDECAR" || { echo "::error::Brak wykonywalnego sidecara $SIDECAR"; exit 1; }
          test -n "$DMG" || { echo "::error::Brak DMG"; exit 1; }
          codesign --verify --deep --strict --verbose=4 "$APP"
          ls -lh "$SIDECAR" "$DMG"
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: tauri-macos-bundle
          # Zielony job BEZ artefaktu to dokładnie ten rodzaj cichego sukcesu,
          # który kosztował 8 dni pracy na starym backendzie (review 2026-07-30).
          if-no-files-found: error
          path: |
            src/src-tauri/target/release/bundle/**/*.dmg
            src/src-tauri/target/release/bundle/**/*.app

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build backend sidecar (PyInstaller)
        shell: pwsh
        run: .\scripts\windows\build-backend-sidecar.ps1
      - name: Install frontend deps
        working-directory: src
        run: npm ci
      - name: Build Tauri (signed when secrets present)
        working-directory: src
        shell: pwsh
        env:
          AW_TAURI_SKIP_SIGN_CHECK: ${{ inputs.skip_sign_check }}
          # MUSI wskazywać LOKALNY backend (review 2026-07-30). Paczka desktop
          # to model pudełkowy: sidecar słucha na 127.0.0.1:8000. Poprzednia
          # wartość domyślna 'https://api.example.com' dawała paczkę zepsutą
          # na dwa sposoby naraz:
          #   1. getApiBase() honoruje VITE_API_URL PRZED fallbackiem na
          #      localhost → apka wołała nieistniejącą domenę,
          #   2. sync-tauri-csp wstrzykiwał tę domenę do connect-src i NIE
          #      dodawał wpisów localhost (robi to tylko dla localhost/127.0.0.1)
          #      → CSP blokowałby 127.0.0.1:8000, nawet gdyby punkt 1 naprawić.
          # `vars.VITE_API_URL` zostaje jako świadome nadpisanie dla ewentualnego
          # builda pod hosting, ale domyślnie budujemy PUDEŁKO.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://127.0.0.1:8000' }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run tauri:build:release
      - name: Sanity check — instalator istnieje i ma sidecara
        shell: pwsh
        run: |
          $inst = Get-ChildItem -Recurse src/src-tauri/target/release/bundle -Include *.msi,*.exe -ErrorAction SilentlyContinue
          if (-not $inst) {
            Write-Error "Brak instalatora w bundle/ — sprawdz target --bundles (msi,nsis) w scripts/tauri-build.mjs."
          }
          $inst | ForEach-Object { Write-Host ("OK instalator: {0} ({1:N1} MB)" -f $_.Name, ($_.Length/1MB)) }
          # Instalator BEZ zamrozonego backendu to paczka, ktora u odbiorcy nie
          # wystartuje — a sam build przechodzi. Zamrozony backend ma ~30-40 MB,
          # wiec maly instalator = brakujacy sidecar.
          $sidecar = Get-ChildItem src/src-tauri/binaries -Filter "architekt-backend-*.exe" -ErrorAction SilentlyContinue
          if (-not $sidecar) { Write-Error "Brak binarki sidecara w src/src-tauri/binaries." }
          Write-Host ("OK sidecar: {0} ({1:N1} MB)" -f $sidecar.Name, ($sidecar.Length/1MB))
          if (($inst | Measure-Object -Property Length -Maximum).Maximum -lt 20MB) {
            Write-Error "Najwiekszy instalator < 20 MB — sidecar prawdopodobnie NIE zostal zbundlowany."
          }
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-bundle
          if-no-files-found: error
          path: |
            src/src-tauri/target/release/bundle/**/*.msi
            src/src-tauri/target/release/bundle/**/*.exe
